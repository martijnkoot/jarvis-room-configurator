name: Validate Jarvis Room Configurator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript syntax
        run: node --check dist/jarvis-room-configurator.js
      - name: Test standalone dashboard module
        run: node --test tests/*.test.cjs
      - name: Test packaging and frontend contracts
        run: python -m unittest discover -s tests -v

  validate-hacs:
    name: Marketplace / HACS plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
